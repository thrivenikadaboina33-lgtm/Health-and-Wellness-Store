<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Login | Naturals</title>
<link rel="stylesheet" href="styles.css">
</head>
<body>
<div class="wrapper">
<form id="loginForm">
<h1>Login</h1>
<div class="input-box"><input id="loginUser" type="text" placeholder="Username or Email" required></div>
<div class="input-box"><input id="loginPassword" type="password" placeholder="Password" required></div>
<div class="remember-forgot"><label><input type="checkbox"> Remember Me</label><a href="#">Forgot Password</a></div>
<button type="submit" class="btn">Login</button>
<p id="loginMessage" class="message"></p>
<div class="register-link"><p>Don't Have an account? <a href="register.html">Register</a></p></div>
</form>
</div>
<script>
document.getElementById('loginForm').addEventListener('submit', async (e) => {
  e.preventDefault();
  const message = document.getElementById('loginMessage');
  message.textContent = 'Checking login...';
  try {
    const response = await fetch('/api/login', {
      method: 'POST', headers: {'Content-Type': 'application/json'},
      body: JSON.stringify({ username: document.getElementById('loginUser').value, password: document.getElementById('loginPassword').value })
    });
    const data = await response.json();
    if (!response.ok) throw new Error(data.message || 'Login failed');
    localStorage.setItem('token', data.token);
    localStorage.setItem('user', JSON.stringify(data.user));
    message.textContent = 'Login successful! Redirecting...';
    setTimeout(() => window.location.href = 'index.html', 600);
  } catch (error) { message.textContent = error.message; }
});
</script>
</body>
</html>
