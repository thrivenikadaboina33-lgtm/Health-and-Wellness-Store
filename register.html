<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Register | Naturals</title>
<link rel="stylesheet" href="styles.css">
</head>
<body>
<div class="wrapper">
<form id="registerForm">
<h1>Register</h1>
<div class="input-box"><input id="username" type="text" placeholder="Username" required></div>
<div class="input-box"><input id="email" type="email" placeholder="Email" required></div>
<div class="input-box"><input id="password" type="password" placeholder="Password (minimum 6 characters)" minlength="6" required></div>
<button type="submit" class="btn">Create Account</button>
<p id="registerMessage" class="message"></p>
<div class="register-link"><p>Already have an account? <a href="login.html">Login</a></p></div>
</form>
</div>
<script>
document.getElementById('registerForm').addEventListener('submit', async (e) => {
  e.preventDefault();
  const message = document.getElementById('registerMessage');
  try {
    const response = await fetch('/api/register', {
      method: 'POST', headers: {'Content-Type': 'application/json'},
      body: JSON.stringify({ username: document.getElementById('username').value, email: document.getElementById('email').value, password: document.getElementById('password').value })
    });
    const data = await response.json();
    if (!response.ok) throw new Error(data.message || 'Registration failed');
    message.textContent = 'Registration successful! Please login.';
    setTimeout(() => window.location.href = 'login.html', 800);
  } catch (error) { message.textContent = error.message; }
});
</script>
</body>
</html>
